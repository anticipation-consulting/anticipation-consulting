# ---------------------------------------------------------------------------
# Anticipation Consulting — site configuration
# A custom Jekyll theme (Spectral / IBM Plex / Cormorant + a generative
# node-link motif). No external theme dependency.
# ---------------------------------------------------------------------------

url: "https://www.anticipationconsulting.com"
title: "Anticipation Consulting"
tagline: "What you didn't know to ask."
mission: "We find questions you didn't know to ask and deliver evidence designed to be challenged."
description: >-
  Data science designed for scrutiny: audited data, reproducible methods,
  interpretable results, and accessible conclusions. Anticipation Consulting is
  a boutique data science and AI consultancy led by Brian C. Keegan, Ph.D. —
  modeling, independent audits, advisory, and expert testimony.
author: "Brian C. Keegan"
email: "contact@anticipationconsulting.com"
locale: "en_US"

# Pretty URLs: /about/, /services/, /services/data-science/, …
permalink: pretty

# Shared SEO defaults (overridable per page via front matter)
og_image: "/images/og-image.png"
og_image_alt: "Anticipation Consulting — data science designed for scrutiny."

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - SECURITY.md
  - LICENSE
  - brand
  - scripts
  - assets/fonts/fetch_webfonts.sh
