name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Verify key pages were generated
        run: |
          test -f _site/index.html
          test -f _site/services/index.html
          test -f _site/services/data-science/index.html
          test -f _site/about/index.html
          test -f _site/expertise/index.html
          test -f _site/insights/index.html
          test -f _site/contact/index.html
          test -f _site/process/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt

      - name: Privacy scan — no third-party resources load
        run: bash scripts/privacy-scan.sh _site

  brand:
    name: Brand & site images in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # Pinned so the regenerated bytes match what's committed: fonttools output
      # is compared exactly, Pillow renders within the checker's tolerance.
      - name: Install image deps
        run: python -m pip install --upgrade "Pillow==12.2.0" "fonttools==4.63.0"

      - name: Fetch brand fonts
        run: bash brand/fetch_fonts.sh

      # Fails if images/og-image.png, assets/favicon.svg, or any brand/dist/ asset
      # has drifted from brand/generate_assets.py (the single source of truth).
      - name: Verify generated images match their source
        run: python3 brand/check_assets.py
