[build]
  command = "jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"

# ---------------------------------------------------------------------------
# Security & privacy response headers. The site loads only same-origin assets
# (fonts are self-hosted; no analytics, CDN, or third-party APIs), so the
# Content-Security-Policy can be strict. 'unsafe-inline' is kept only for
# style-src because the markup uses inline style="" attributes (low risk);
# scripts are all external, so script-src needs no exception.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-DNS-Prefetch-Control = "off"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Self-hosted fonts: cache a week (refreshed at most quarterly), not "immutable"
# since filenames aren't content-hashed.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"