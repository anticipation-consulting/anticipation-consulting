<header class="site-header" data-screen-label="header">
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="Anticipation Consulting — home">
      {%- include wordmark.html -%}
    </a>
    <ul class="nav-links">
      <li><a href="/services/"{% if page.nav == 'services' %} class="active"{% endif %}>Services</a></li>
      <li><a href="/process/"{% if page.nav == 'process' %} class="active"{% endif %}>Process</a></li>
      <li><a href="/expertise/"{% if page.nav == 'expertise' %} class="active"{% endif %}>Expertise</a></li>
      <li><a href="/about/"{% if page.nav == 'about' %} class="active"{% endif %}>About</a></li>
      <li><a href="/insights/"{% if page.nav == 'insights' %} class="active"{% endif %}>Insights</a></li>
      <li><a href="/contact/"{% if page.nav == 'contact' %} class="active"{% endif %}>Contact</a></li>
    </ul>
    <div class="nav-cta">
      {%- if page.nav == 'contact' %}
      <a class="btn btn-primary" href="mailto:contact@anticipationconsulting.com">Email directly <span class="arrow">&rarr;</span></a>
      {%- else %}
      <a class="btn btn-primary" href="/contact/">Start a conversation <span class="arrow">&rarr;</span></a>
      {%- endif %}
      <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
